<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanet 3D Orbit Simulator</title>

    <!-- FONTS GANG -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Three.js Library  and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            color: #fff;
            background-color: #030305;
            overflow-x: hidden;
        }

        /* 3D canvas container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* FLOAting HUD */
        .hud-layer {
            position: absolute;
            top: 0px;
            left: 0px;
            width:100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;

        }

        .interactive {
            pointer-events: auto; /* Allow interaction with buttons and inputs */
        }

        .header {
            background-color: rgba(10, 10, 16, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid #00f0ff;
            border-radius: 8px;
            padding: 15px 25px;
            max-width: 450px;
            box-shadow: 0 0px 20px rgba(0, 240, 255, 0.2);
        }

        .header h1 {
            font-size: 0.8rem;
            margin: 5px 0 0 0;
            color: #a1a1aa;
        }

        .header p {
            font-size: 0.8rem;
            margin: 5px 0 0 0;
            color: #a1a1aa;
        }

        
        /* MAIN CONTROL PANEL */

        .panel {
            background-color: rgba(10, 10, 16, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffe600;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #e4e4e7;
        }

        .control-label span {
            color: #00f0ff;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #00f0ff;
            cursor: pointer;
        }

        .btn-analyze {
            width: 100%;
            background: #e60026;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #00f0ff;
            transition: all 0.2s ease;
            text-transform: uppercase;
            margin-top: 10px;
        }
        
        .btn-analyze:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #00f0ff;
        }

        /* DISPLAY RESULTS */
        #result {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            border: 1px solid #fff;
        }

        /* CAMERA TOOLS */
        .hint-bar {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #888;
            align-self: center;
        }
    </style>
</head>
<body>


    <!-- 3D engine container -->
    <div id="canvas-container"></div>

    <!-- HUD interface  -->
     <div class="hud-layer">
        
        <div class=" header interactive">
            <h1>Exoplanet 3D Engine</h1>
            <p>WebGL Real-Time Orbital Mechanics & Classification</p>
        </div>

        <div class="hud-bottom interactive" style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%">

            <!-- LEFT CONTROL PANEL -->
            <div class="panel">
                <div class="panel-title">
                    <span>Planet Parameters</span>
                    <span style="font-size: 0.7rem; color: #00f0ff;">LIVE 3D</span>
                </div>

                <div class="control-group">
                    <label class="control-label">Planet Mass (Earths) <span id="mass-val">5.0</span></label>
                    <input type="range" id="mass" min="0.1" max="20" step="0.1" value="5.0" oninput="updateSimulation()">
                </div>

                <div class="control-group">
                    <label class="control-label">Planet Radius (Earth Radii) <span id="radius-val">1.5</span></label>
                    <input type="range" id="radius" min="0.3" max="5.0" step="0.1" value="1.5" oninput="updateSimulation()">
                </div>

                <div class="control-group">
                    <label class="control-label">Orbital Period (Days) <span id="period-val">30</span></label>
                    <input type="range" id="period" min="1" max="500" step="1" value="30" oninput="updateSimulation()">
                </div>

                <div class="control-group">
                    <label class="control-label">Stellar Temp (Kelvin) <span id="temp-val">5800</span></label>
                    <input type="range" id="star-temp" min="2000" max="10000" step="100" value="5800" oninput="updateSimulation()">
                </div>

                <button class="btn-analyze" onclick="sendPrediction()"> RUN ML ANALYSIS</button>
                <div id="result"></div>
            </div>

            <div class="hint-bar">
                🖱️ Left Click + Drag on background to rotate system
            </div>

        </div>
     </div>

     <script>
        let scene, camera, renderer;
        let starMesh, planetMesh, systemGroup;
        let orbitAngle = 0;
        let orbitRadius = 18;
        let orbitSpeed = 0.02;

        // CUstom Mouse drag controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0};

        function init3D() {
            const container = document.getElementById('canvas-container');

            // 1. Scene 
            scene = new THREE.Scene();

            // 2. Camera 
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 45);
            camera.lookAt(0, 0, 0);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 4. System Group
            systemGroup = new THREE.Group();
            scene.add(systemGroup);

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 2, 100);
            scene.add(pointLight);

            // 6. Starfield
            createStarfield();

            // 7. Central Star
            const starGeo = new THREE.SphereGeometry(3.5, 32, 32);
            const starMat = new THREE.MeshBasicMaterial({color: 0xffaa00});
            starMesh = new THREE.Mesh(starGeo, starMat);
            systemGroup.add(starMesh);

            //8. Custom Planet
            const planetGeo = new THREE.SphereGeometry(1, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.5 });
            planetMesh = new THREE.Mesh(planetGeo, planetMat);
            systemGroup.add(planetMesh);

            // 9. ORbit Ring
            const ringGeo = new THREE.RingGeometry(orbitRadius - 0.1, orbitRadius + 0.1, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            const orbitRing = new THREE.Mesh(ringGeo, ringMat);
            orbitRing.rotation.x = Math.PI / 2;
            systemGroup.add(orbitRing);

            // Event listeners for Custom drag-controls
            window.addEventListener('mousedown', (e) => { isDragging = true; });
            window.addEventListener('mouseup', (e) => { isDragging = false; });
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);

            updateSimulation();
            animate();
        }

        function createStarfield() {
            const starsGeo = new THREE.BufferGeometry();
            const count = 2000;
            const positions = new Float32Array(count * 3);

            for(let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() -0.5) * 300;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.8});
            scene.add(new THREE.Points(starsGeo, starsMat)); 
        }

        function onMouseMove(e) {
            if (!isDragging) return;
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            systemGroup.rotation.y += deltaMove.x * 0.005;
            systemGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function updateSimulation() {
            const mass = parseFloat(document.getElementById('mass').value);
            const radius = parseFloat(document.getElementById('radius').value);
            const period = parseFloat(document.getElementById('period').value);
            const temp = parseFloat(document.getElementById('star-temp').value);

            document.getElementById('mass-val').innerText = mass.toFixed(1);
            document.getElementById('radius-val').innerText = radius.toFixed(1);
            document.getElementById('period-val').innerText = period.toFixed(0);
            document.getElementById('temp-val').innerText = temp.toFixed(0);

            if (planetMesh) {
                planetMesh.scale.setScalar(radius);
            }

            orbitSpeed = (1/ period) * 1.5;

            if (starMesh && planetMesh) {
                let starColor, planetColor;
                if (temp < 4000) {
                    starColor = new THREE.Color(0xff3300);
                    planetColor = new THREE.Color(0xef4444);
                } else if (temp < 7000) {
                    starColor = new THREE.Color(0xffdd66);
                    planetColor = new THREE.Color(0x10b981);
                } else {
                    starColor = new THREE.Color(0x88ccff);
                    planetColor = new THREE.Color(0x00f0ff);
                }

                starMesh.material.color = starColor;
                planetMesh.material.color = planetColor;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (planetMesh) {
                orbitAngle += orbitSpeed
                planetMesh.position.x = Math.cos(orbitAngle) * orbitRadius;
                planetMesh.position.z = Math.sin(orbitAngle) * orbitRadius;
                planetMesh.rotation.y += 0.01;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        async function sendPrediction() {
            const payload = {
                pl_bmasse: parseFloat(document.getElementById('mass').value),
                pl_rade: parseFloat(document.getElementById('radius').value),
                pl_orbper: parseFloat(document.getElementById('period').value),
                st_teff: parseFloat(document.getElementById('star-temp').value)
            };

            const apiUrl = "https://rikimii-exoplanet-api.hf.space/predict";
            const resultDiv = document.getElementById('result');

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`Status ${response.status}`);

                const data = await response.json();
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `CLASSIFICATION: ${data.prediction.toUpperCase()}`;

                if (data.prediction === "Habitable Candidate") {
                    resultDiv.style.background = "#047857";
                } else if (data.prediction === "Gas Giant") {
                    resultDiv.style.background = "#b45309";
                } else {
                    resultDiv.style.background = "#1d4ed8";
                }

            } catch (error) {
                console.error("API Error:", error);
                resultDiv.style.display = "block";
                resultDiv.style.background = "#e60026";
                resultDiv.innerHTML = `FEED OFFLINE<br><span style="font-size: 0.75rem; font-weight:normal;">Backend waking up. Try again later...</span>`;    
            }
        }

        window.onload = init3D;
     </script>
</body>
</html>
