<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanet 3D Orbit Simulator</title>

    <!-- FONTS GANG -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Three.js Library  and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            color: #fff;
            background-color: #030305;
            overflow-x: hidden;
        }

        /* 3D canvas container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* FLOAting HUD */
        .hud-layer {
            position: relative;
            z-index: 2;
            pointer-events: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto; /* Allow interaction with buttons and inputs */
        }

        .header {
            background-color: rgba(10, 10, 16, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 15px 25px;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #00f0ff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.8rem;
            margin: 5px 0 0 0;
            color: #a1a1aa;
        }

        /* MAIN HUD */
        .hud-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            background-color: rgba(10, 10, 16, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            width: 360px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); 
        }
        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffe600;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-label {
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #e4e4e7;
        }

        .control-label span {
            color: #00f0ff;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #00f0ff;
            cursor: pointer;
        }

        .btn-analyze {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
            color: #000;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        
        .btn-analyze:hover {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: translateY(-1px);
        }

        /* DISPLAY RESULTS */
        #result {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* CAMERA TOOLS */
        .camera-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- 3D CANVAS -->
    <div id="canvas-container"></div>

    <!-- HUD OVERLAY -->
    <div class="hud-layer">

        <!-- Header -->
        <div class="header interactive">
            <h1>Exoplanet 3D Engine</h1>
            <p>WebGL Real-Time Orbital Mechanics & Classification</p>
        </div>

        <div class="camera-hint">
            🖱️ Left Click + Drag to Rotate Camera | Scroll to Zoom
        </div>

        <!-- MAIN CONTROLS -->
        <div class="hud-main">
            <div class="panel-title">
                <span>Planet Parameter</span>
                <span style="font-size: 0.7rem; color: #00f0ff;"> LIVE 3D</span>
            </div>

            <div class="control-group">
                <label class="control-label">Planet Mass (Earths) <span id="mass-val">5.0</span></label>
                <input type="range" id="mass" min="0.1" max="20" step="0.1" value="5.0" oninput="updateSimulation()">
            </div>

            <div class="control-group">
                <label class="control-label">Planet Radius (Earth Radii) <span id="radius-val">1.5</span></label>
                <input type="range" id="radius" min="0.3" max="5.0" step="0.1" value="1.5" oninput="updateSimulation()">
            </div>

            <div class="control-group">
                <label class="control-label">Orbital Period (Days) <span id="period-val">30</span></label>
                <input type="range" id="period" min="1" max="500" step="1" value="30" oninput="updateSimulation()">
            </div>

            <div class="control-group">
                <label class="control-label">Stellar Temp (Kelvin) <span id="star_temp-val">5800</span></label>
                <input type="range" id="star_temp" min="2000" max="10000" step="100" value="5800" oninput="updateSimulation()">
            </div>

            <button class="btn-analyze" onclick="sendPrediction()">RUN ML ANALYSIS</button>

            <div id="result"></div>
        </div>
    
    
    </div>
</div>

<!-- SIMULATION SCRIPT-->
<script>
    let scene, camera, renderer, controls;
    let starMesh, PlanetMesh, orbitRing;
    let orbitAngle = 0;
    let oribitRadius = 18;
    let orbitSpeed = 0.02;

    function init3D() {
        const container = document.getElementById('canvas-container');

        // 1. Scene
        scene = new THREE.Scene();
        scene.fog = new THREE.fogExp2(0x0300305, 0.008);

        // 2. Camera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 45);

        // 3. Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // 4. Controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 100;
        controls.minDistance = 10;

        // 5. LIGHTS
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const starLight = new THREE.PointLight(0xffffff, 2, 100);
        scene.add(starLight);

        // 6. STARFIELD bg
        createStarfield();

        // 7. CENTRAL STAR MESH
        const starGEO = new THREE.SphereGeometry(4, 32, 32);
        const starMet = new THREE.MeshBasicMaterial({ color: 0xffaa00});
        starMesh = new THREE.Mesh(starGEO, starMAT);
        scene.add(starMesh);

        // 8. CUSTOM EXOPLANET MESH
        const planetGeo = new THREE.SphereGeometry(1, 32, 32);
        const planetMat = new THREE.MeshStandardMaterial({
            color: 0x00f0ff,
            roughness: 0.6,
            metalnes: 0.2

        });
        planetMesh = new THREE.Mesh(planetGeo, planetMat);
        scene.add(planetMesh);

        // 9. Orbit Trajectory Ring
        createOrbitRing();

        window.addEventListener('resize', onWindowResize);

        // Intial para Sync
        updateSimulation();

        // Start Loop
        animate();
    }

    function createStarfield() {
        const starGeo = new THREE.BufferGeometry();
        const count = 3000;
        const positions = new Float32Array(count + 3);

        for(let i = 0; i < count * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 300;

        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMat = new THREE.PointMaterial({ color: 0x888888, size: 0.7 });
        const starPoints = new Three.Points(starGeo, starsMat);
        scene.add(starPoints);

    }

    function createOrbitRing() {
        const ringGeo = new THREE.RingGeometry(oribitRadius - 0.05, oribitRadius + 0.05, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.25});
        orbitRing = new THREE.Mesh(ringGeo, ringMat);
        orbitRing.rotation.x = Math.PI / 2;
        scene.add(orbitRing);
    }

    function updateSimulation() {
        const mass = parseFloat(document.getElementById('mass').value);
        const radius = parseFloat(document.getElementById('radius').value);
        const period = parseFloat(document.getElementById('period').value);
        const temp = parseFloat(document.getElementById('star_temp').value);

        // Update UI nums
        document.getElementbyId('mass-val').innerText = mass.toFixed(1);
        document.getElementbyId('radius-val').innerText = radius.toFixed(1);
        document.getElementbyId('period-val').innerText = period.toFixed(0);
        document.getElementbyId('temp-val').innerText = temp.toFixed(0);

        // Scale the planet mesh
        if (planetMesh) {
            planetMesh.scale.setScalar(radius);
        }
    

    // Adjust orbit speed based on orbital period
    orbitSpeed = (1 / period) * 1.5;

    // Color and star emmissive based on temp
        if (starMesh && planetMesh) {
            let starColor, planetColor;

            if (temp < 4000) {
                starColor = new Three.Color(0xff3300); // Redder star
                planetColor = new Three.Color(0xef4444); // Cooler planet
            } else if (temp < 7000) {
                starColor = new Three.Color(0xffdd66); // Yellow
                planetColor = new Three.Color(0x10b981); // Earth like Color
            } else {
                starColor = new Three.Color(0x88ccff); // Hot blue
                planetColor = new Three.Color(0x00f0ff); // Scorched
            }

        starMesh.material.color = starColor;
        planetMesh.material.color = planetColor;

    }
}

function animate() {
    requestAnimationFrame(animate);

    // rotate Star
    if (starMesh) starMesh.rotation.y += 0.002;

    // orbit planet around star
    if (planetMesh) {
        orbitAngle += orbitSpeed;
        planetMesh.position.x = Math.cos(orbitAngle) * oribitRadius;
        planetMesh.position.z = Math.sin(orbitAngle) * oribitRadius;
        planetMesh.position.y += 0.01;// self rotation
    }

    controls.update();
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

async function sendPrediction() {
    const payload = {
        pl_bmasse: parseFloat(document.getElementById('mass').value),
        pl_rade: parseFloat(document.getElementById('radius').value),
        pl_orbper: parseFloat(document.getElementById('period').value),
        st_teff: parseFloat(document.getElementById('star_temp').value)
    };

    const apiUrl = "https://rikimii-exoplanet-api.hf.space/predict";
    const resultDiv = document.getElementById('result');
    
    try {
        const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Server returned status ${response.status}');

        const data = await response.json();

        resultDiv.style.display = "block";
        resultDiv.innerHTML = "CLASSIFICATION: ${data.prediction.toUpperCase()}";

        if (data.prediction === "Habitable Candidate") {
            resultDiv.style.background = "rgba(16, 185, 129, 0.25)";
            resultDiv.style.color = "#10b981";
            resultDiv.style.borderColor = "#10b981";
        } else if (data.prediction === "Gas Giant") {
            resultDiv.style.background = "rgba(245, 158, 11, 0.25)";
            resultDiv.style.color = "#f59e0b";
            resultDiv.style.borderColor = "#f59e0b";
        } else {
            resultDiv.style.background = "rgba(59, 130, 246, 0.5)";
            resultDiv.style.color = "#3b82f6";
            resultDiv.style.borderColor = "#3b82f6";
        }
    
    } catch (error) {
        console.error("API Error:", error);
        resultDiv.style.display = "block";
        resultDiv.style.background = "rgba(239, 68, 68, 0.25)";
        resultDiv.style.color = "#dc2626";
        resultDiv.style.borderColor = "#dc2626";
        resultDiv.innerHTML = " FEED OFFLINE<br><span style='font-size:0.75rem; font-weight:normal;'>Backend wakey-waking up, try again later...</span>";

    }
}

//initialize 3D scene
window.onload = init3D;
</script>
</body>
</html>
